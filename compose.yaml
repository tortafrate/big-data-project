services:
  # --- 1. BASE DE DONNÉES ---
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - big-data-network

  # --- 2. AIRFLOW 3 (SERVICES AUTOMATISÉS) ---
  airflow-init:
    build:
      context: .
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: custom-airflow:${AIRFLOW_VERSION}
    container_name: airflow_init
    user: "0:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    command: |
      bash -euxo pipefail -c '
        echo "Fixing permissions..."
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/scripts
        chmod -R 777 /opt/airflow/logs /opt/airflow/dags /opt/airflow/scripts

        echo "Permissions fixed. Starting migration..."
        airflow db migrate

        echo "Creating/forcing spark_default connection (host must include spark://)..."
        airflow connections delete spark_default || true
        airflow connections add spark_default --conn-type spark --conn-host "spark://spark-master" --conn-port 7077

        airflow version
      '
    volumes:
      - ./dags:/opt/airflow/dags:Z
      - ./scripts:/opt/airflow/scripts:Z
      - ./logs:/opt/airflow/logs:Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - big-data-network

  airflow-api-server:
    build:
      context: .
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: custom-airflow:${AIRFLOW_VERSION}
    container_name: airflow_api_server
    ports:
      - "${AIRFLOW_WEB_PORT}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PYTHONPATH: /opt/airflow/scripts
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__ACCESS_LOG: 'true'
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__ELASTICSEARCH__HOST: 'http://elasticsearch:9200'
      AIRFLOW__ELASTICSEARCH__WRITE_STDOUT: 'true'
      AIRFLOW__ELASTICSEARCH__JSON_FORMAT: 'true'
      AIRFLOW__API_SERVER__PORT: 8080
      AIRFLOW_CONN_AWS_DEFAULT: "aws://minioadmin:minioadmin@?host=http%3A%2F%2Fminio%3A9000&region_name=us-east-1"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    volumes:
      - ./dags:/opt/airflow/dags:Z
      - ./scripts:/opt/airflow/scripts:Z
      - ./logs:/opt/airflow/logs:Z
    command: airflow api-server
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - big-data-network

  airflow-scheduler:
    build:
      context: .
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: custom-airflow:${AIRFLOW_VERSION}
    container_name: airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PYTHONPATH: /opt/airflow/scripts
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__ELASTICSEARCH__HOST: 'http://elasticsearch:9200'
      AIRFLOW__ELASTICSEARCH__WRITE_STDOUT: 'true'
      AIRFLOW__ELASTICSEARCH__JSON_FORMAT: 'true'
      AIRFLOW_CONN_AWS_DEFAULT: "aws://minioadmin:minioadmin@?host=http%3A%2F%2Fminio%3A9000&region_name=us-east-1"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    volumes:
      - ./dags:/opt/airflow/dags:Z
      - ./scripts:/opt/airflow/scripts:Z
      - ./logs:/opt/airflow/logs:Z
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    networks:
      - big-data-network

  airflow-dag-processor:
    build:
      context: .
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: custom-airflow:${AIRFLOW_VERSION}
    container_name: airflow_dag_processor
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PYTHONPATH: /opt/airflow/scripts
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__ELASTICSEARCH__HOST: 'http://elasticsearch:9200'
      AIRFLOW__ELASTICSEARCH__WRITE_STDOUT: 'true'
      AIRFLOW__ELASTICSEARCH__JSON_FORMAT: 'true'
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    volumes:
      - ./dags:/opt/airflow/dags:Z
      - ./scripts:/opt/airflow/scripts:Z
      - ./logs:/opt/airflow/logs:Z
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - big-data-network

  airflow-triggerer:
    build:
      context: .
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: custom-airflow:${AIRFLOW_VERSION}
    container_name: airflow_triggerer
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PYTHONPATH: /opt/airflow/scripts
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__LOGGING__REMOTE_LOGGING: 'true'
      AIRFLOW__ELASTICSEARCH__HOST: 'http://elasticsearch:9200'
      AIRFLOW__ELASTICSEARCH__WRITE_STDOUT: 'true'
      AIRFLOW__ELASTICSEARCH__JSON_FORMAT: 'true'
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    volumes:
      - ./dags:/opt/airflow/dags:Z
      - ./scripts:/opt/airflow/scripts:Z
      - ./logs:/opt/airflow/logs:Z
    command: airflow triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    networks:
      - big-data-network

  # --- 3. MINIO & SPARK ---
  minio:
    image: minio/minio
    container_name: datalake_minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      retries: 3
    networks:
      - big-data-network

  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c '
        /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        /usr/bin/mc mb --ignore-existing myminio/datalake
        /usr/bin/mc anonymous set public myminio/datalake
        exit 0
      '
    networks:
      - big-data-network

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: big-data-project-spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      - PYSPARK_PYTHON=/usr/bin/python3.12
    ports:
      - "${SPARK_WEB_PORT:-9090}:8080"
      - "7077:7077"
    volumes:
      - ./scripts:/opt/spark/scripts
    networks:
      - big-data-network

  spark-worker:
    image: big-data-project-spark:3.5.1
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - PYSPARK_PYTHON=/usr/bin/python3.12
    depends_on:
      - spark-master
    volumes:
      - ./scripts:/opt/spark/scripts
    networks:
      - big-data-network

  # --- 4. VISUALISATION ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTIC_PORT}:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - big-data-network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - big-data-network

volumes:
  postgres_data:
  minio_data:
  elastic_data:

networks:
  big-data-network:
    driver: bridge