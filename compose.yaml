# 1. L'ANCRE (Indispensable tout en haut)
x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    AWS_DEFAULT_REGION: us-east-1
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./requirements.txt:/opt/airflow/requirements.txt
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  # --- STOCKAGE ---
  minio:
    image: minio/minio
    container_name: datalake_minio
    ports: ["${MINIO_API_PORT}:9000", "${MINIO_CONSOLE_PORT}:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"

  minio-create-bucket:
    image: minio/mc
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/datalake; exit 0;"

  # --- TRAITEMENT ---
  spark-master:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark_master
    ports: ["${SPARK_WEB_PORT}:8080", "7077:7077"]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark_worker
    depends_on: [spark-master]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # --- ORCHESTRATION (Les 6 services Airflow) ---
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow api-server"
    ports: ["${AIRFLOW_WEB_PORT}:8080"]
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow scheduler"
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow_dag_processor
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow dag-processor"
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow triggerer"
    depends_on: { airflow-init: { condition: service_completed_successfully } }

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
    command: bash -c "airflow db migrate && airflow version"

  # --- VIZ ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    environment: [discovery.type=single-node, xpack.security.enabled=false]
    ports: ["${ELASTIC_PORT}:9200"]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    ports: ["${KIBANA_PORT}:5601"]
    environment: [ELASTICSEARCH_HOSTS=http://elasticsearch:9200]
    depends_on: [elasticsearch]

volumes:
  postgres_data:
  minio_data:
  elastic_data:
